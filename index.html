<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assessment</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif;}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
.container{background:#fff;border-radius:10px;box-shadow:0 0 20px rgba(0,0,0,.2);width:100%;max-width:600px;padding:30px;}
.start-screen,.result-container{text-align:center;padding:20px;}
.start-screen h1,.quiz-header h1{color:#333;margin-bottom:30px;font-size:2rem;}
button{background:#764ba2;color:#fff;border:none;padding:12px 25px;border-radius:5px;cursor:pointer;font-size:1rem;transition:background-color .3s ease;}
button:hover{background:#667eea;}
.quiz-header{margin-bottom:30px;}
.quiz-info{display:flex;justify-content:space-between;padding:15px;background:#f8f9fa;border-radius:5px;margin-top:20px;}
.question-container{margin-bottom:20px;}
.question-container h2{color:#333;margin-bottom:20px;font-size:1.2rem;}
.options{display:grid;gap:10px;}
.option{background:#f8f9fa;padding:15px;border-radius:5px;cursor:pointer;transition:background-color .3s ease;}
.option:hover{background:#e9ecef;}
.option input[type="radio"]{display:none;}
.option label{cursor:pointer;display:block;width:100%;padding-left:25px;position:relative;}
.option label:before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:16px;height:16px;border:2px solid #764ba2;border-radius:50%;}
.option input[type="radio"]:checked+label:after{content:'';position:absolute;left:4px;top:50%;transform:translateY(-50%);width:12px;height:12px;background:#764ba2;border-radius:50%;}
.option:has(input:checked){background:#e9ecef;}
.hide{display:none;}
.result-container h2{color:#333;margin-bottom:20px;}
.result-container p{margin:10px 0;font-size:1.1rem;color:#666;}
#final-score{color:#764ba2;font-weight:bold;font-size:1.2rem;}
@media(max-width:480px){
  .container{width:95%;padding:15px;}
  .quiz-info{flex-direction:column;gap:10px;text-align:center;}
  button{width:100%;}
}
</style>
</head>
<body>
<div class="container">
  <div class="start-screen" id="start-screen">
    <h1>Welcome To Entrance Exams</h1>
    <button id="start-button">Start Quiz</button>
  </div>

  <div class="quiz-container hide">
    <div class="quiz-header">
      <h1>Assessment</h1>
      <div class="quiz-info">
        <span class="question-count">Question: <span id="current">1</span>/<span id="total">10</span></span>
        <span class="timer">Time: <span id="time">60</span>s</span>
        <span class="score">Score: <span id="score">0</span></span>
      </div>
    </div>
    <div class="quiz-body">
      <div class="question-container">
        <h2 id="question">Question goes here</h2>
        <div class="options">
          <div class="option">
            <input type="radio" name="answer" id="a" class="answer">
            <label for="a" id="a_text">option A</label>
          </div>
          <div class="option">
            <input type="radio" name="answer" id="b" class="answer">
            <label for="b" id="b_text">option B</label>
          </div>
          <div class="option">
            <input type="radio" name="answer" id="c" class="answer">
            <label for="c" id="c_text">option C</label>
          </div>
          <div class="option">
            <input type="radio" name="answer" id="d" class="answer">
            <label for="d" id="d_text">option D</label>
          </div>
        </div>
      </div>
      <button id="submit">Submit</button>
    </div>

    <div class="result-container hide">
      <h2>Quiz completed!</h2>
      <p>Your Score: <span id="final-score">0</span>/<span id="final-total">10</span></p>
      <p>Time: <span id="completion-time">0</span> Seconds</p>
      <button id="restart">Restart Quiz</button>
    </div>
  </div>
</div>

<script>
const quizData = [
  {question:"What does html stand for?",a:"Hyper Text Markup Language",b:"Home Tool Markup Language",c:"Hyperlinks and Text Markup Language",d:"High Text Markup Language",correct:"a"},
  {question:"Which programming language is known as the language of the web?",a:"Python",b:"JavaScript",c:"Java",d:"C++",correct:"b"},
  {question:"What is the output of 2+'2' in JavaScript?",a:"4",b:"22",c:"undefined",d:"error",correct:"b"},
  {question:"Which symbol is used for comments in Python?",a:"//",b:"#",c:"/* */",d:"<!-- -->",correct:"b"},
  {question:"What is the file extension for a JavaScript file?",a:".java",b:".js",c:".jsx",d:".jvs",correct:"b"},
  {question:"Which HTML element is used to include JavaScript code?",a:"<javascript>",b:"<script>",c:"<js>",d:"<code>",correct:"b"},
  {question:"Which of the following is a backend programming language?",a:"HTML",b:"CSS",c:"Node.js",d:"SQL",correct:"c"},
  {question:"Which keyword is used to declare a variable in JavaScript?",a:"var",b:"let",c:"const",d:"All of the above",correct:"d"},
  {question:"What does CSS stand for?",a:"Cascading Style Sheets",b:"Computer Style Sheets",c:"Creative Style Sheets",d:"Colorful Style Sheets",correct:"a"},
  {question:"Which of the following is a version control system?",a:"Git",b:"Node.js",c:"NPM",d:"Docker",correct:"a"}
];

const questionEl = document.getElementById('question');
const a_text = document.getElementById('a_text');
const b_text = document.getElementById('b_text');
const c_text = document.getElementById('c_text');
const d_text = document.getElementById('d_text');
const submitBtn = document.getElementById('submit');
const answerEls = document.querySelectorAll('.answer');
const finalScoreEl = document.getElementById('final-score');
const finalTotalEl = document.getElementById('final-total');
const restartBtn = document.getElementById('restart');
const currentQuestionEl = document.getElementById('current');
const totalQuestionsEl = document.getElementById('total');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const startBtn = document.getElementById('start-button');
const startScreen = document.getElementById('start-screen');
const completionTimeEl = document.getElementById('completion-time');
const quizContainer = document.querySelector('.quiz-container');
const quizHeader = document.querySelector('.quiz-header');
const quizBody = document.querySelector('.quiz-body');
const resultContainer = document.querySelector('.result-container');

let currentQuiz = 0;
let score = 0;
let timeLeft = 60;
let timer;
let shuffledQuizData = [];
let startTime;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startQuiz(){
  startScreen.classList.add('hide');
  quizContainer.classList.remove('hide');
  quizHeader.classList.remove('hide');
  quizBody.classList.remove('hide');
  resultContainer.classList.add('hide');

  currentQuiz = 0;
  score = 0;
  timeLeft = 60;
  scoreEl.innerText = score;
  shuffledQuizData = shuffle(quizData);
  totalQuestionsEl.innerText = shuffledQuizData.length;
  finalTotalEl.innerText = shuffledQuizData.length;

  startTime = Date.now();
  startTimer();
  loadQuiz();
}
startBtn.addEventListener('click', startQuiz);
restartBtn.addEventListener('click', startQuiz);

function startTimer(){
  clearInterval(timer);
  timeEl.innerText = timeLeft;
  timer = setInterval(() => {
    timeLeft--;
    timeEl.innerText = timeLeft;
    if(timeLeft <= 0){
      clearInterval(timer);
      showResult();
    }
  }, 1000);
}

function loadQuiz(){
  answerEls.forEach((answerEl) => { answerEl.checked = false; });
  const currentQuizData = shuffledQuizData[currentQuiz];

  questionEl.innerText = currentQuizData.question;
  a_text.innerText = currentQuizData.a;
  b_text.innerText = currentQuizData.b;
  c_text.innerText = currentQuizData.c;
  d_text.innerText = currentQuizData.d;

  currentQuestionEl.innerText = currentQuiz + 1;
}

function getSelected(){
  let answer = undefined;
  answerEls.forEach((answerEl) => {
    if(answerEl.checked) answer = answerEl.id;
  });
  return answer;
}

submitBtn.addEventListener('click', () => {
  const answer = getSelected();
  if(answer === undefined){
    alert("Please select an answer.");
    return;
  }

  const currentQuizData = shuffledQuizData[currentQuiz];
  if(answer === currentQuizData.correct) score++;
  scoreEl.innerText = score;

  currentQuiz++;
  if(currentQuiz < shuffledQuizData.length){
    loadQuiz();
  } else {
    clearInterval(timer);
    showResult();
  }
});

function showResult(){
  clearInterval(timer);
  quizHeader.classList.add('hide');
  quizBody.classList.add('hide');
  resultContainer.classList.remove('hide');

  finalScoreEl.innerText = score;
  const elapsed = Math.min(60, Math.round((Date.now() - startTime) / 1000));
  completionTimeEl.innerText = elapsed;
}
</script>
</body>
</html>
